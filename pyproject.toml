[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xlsx-gantt"
version = "0.4.3"
description = "Editable, presentation-ready Gantt charts as native Excel (.xlsx) files from Python or JSON, with a CLI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "trondegil" },
]
keywords = ["gantt", "gantt-chart", "excel", "xlsx", "openpyxl", "chart", "cli", "json",
            "project-management", "project-planning", "roadmap", "timeline"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
]

[project.urls]
Homepage = "https://github.com/trondegil/xlsx-gantt"
Repository = "https://github.com/trondegil/xlsx-gantt"
"Bug Tracker" = "https://github.com/trondegil/xlsx-gantt/issues"
Changelog = "https://github.com/trondegil/xlsx-gantt/blob/master/CHANGELOG.md"
Examples = "https://github.com/trondegil/xlsx-gantt/tree/master/examples"

[project.optional-dependencies]
# Deprecated no-op alias — Pillow is now a default dependency.
logo = ["Pillow>=10.0.0"]
dev  = ["pytest>=7.0", "ruff>=0.4", "mypy>=1.10"]

[project.scripts]
xlsx-gantt = "xlsx_gantt.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["xlsx_gantt*"]

[tool.setuptools.package-data]
xlsx_gantt = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E221", "E241"]  # aligned assignments/annotations are intentional style

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.10"   # oldest version mypy can target; CI runs the tests on 3.9
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true
