[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xlsx-gantt"
version = "0.1.0"
description = "Generate richly styled Gantt charts as Excel (.xlsx) files"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "trondegil" },
]
keywords = ["gantt", "excel", "xlsx", "openpyxl", "chart", "project-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "openpyxl>=3.1.0",
]

[project.urls]
Homepage = "https://github.com/trondegil/xlsx-gantt"
Repository = "https://github.com/trondegil/xlsx-gantt"
"Bug Tracker" = "https://github.com/trondegil/xlsx-gantt/issues"

[project.optional-dependencies]
# Enables non-PNG logo formats (JPEG, BMP, GIF, TIFF)
logo = ["Pillow>=10.0.0"]
dev  = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["xlsx_gantt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
